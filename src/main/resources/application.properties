# Conexão com o PostgreSQL local (docker compose up -d -> porta 5433)
spring.datasource.url=jdbc:postgresql://localhost:5434/gympass
spring.datasource.username=${DB_USER:gympass}
spring.datasource.password=${DB_PASSWORD:gympass123}

# O esquema vem de banco/01-modelagem.sql; o Hibernate só valida, nunca altera.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Mantém o contexto de persistência aberto até o fim da requisição: o
# MontadorDeEstado roda depois dos Services e ainda carrega coleções
# preguiçosas (modalidades, funcionários, reservas). Explícito para não
# depender do padrão e para silenciar o aviso na subida.
spring.jpa.open-in-view=true

# Sem isto o Spring serve index.html, app.js e styles.css só com Last-Modified
# e o navegador reaproveita a cópia antiga por horas, sem perguntar ao
# servidor. no-cache obriga a revalidar a cada carga (304 se nada mudou).
spring.web.resources.cache.cachecontrol.no-cache=true
